
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update   # ??? ????????; ?? ????? ????? ????????
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
server:
  port: ${PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:bWloYWlsZWJsYW5jaGtlZGZyZXRoeXJ0dG9waW1qeWh0bm9pcGpnZmhiaW9tbnBmZ25vbWlwa2ZnaG5samtmYmdua2pmZ2huams}
    issuer: ${JWT_ISSUER:realty-api}
    ttl-minutes: ${JWT_TTL_MINUTES:43200}

logging:
  level:
    org.springframework.security: DEBUG

yandex:
  feed:
    storageDir: ${YANDEX_FEED_DIR:/var/app/feeds/yandex}   # директория на диске
    baseUrl: ${YANDEX_FEED_BASE_URL:localhost:8080/feeds/yandex}   # базовый публичный URL

auth:
  username: ${AUTH_USERNAME:admin}
  password: ${AUTH_PASSWORD:admin}

# Удалённый сервис статистики объявлений (показы, контакты, история, динамика)
stats:
  service:
    base-url: ${STATS_SERVICE_BASE_URL:http://localhost:8082}
    path: ${STATS_SERVICE_PATH:/api/listings}
    enabled: ${STATS_SERVICE_ENABLED:true}